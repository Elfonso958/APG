server {
    listen 80;
    server_name staff.chatsops.co.nz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://staff.chatsops.co.nz/APG/dcs;
    }
}

server {
    listen 443 ssl;
    server_name staff.chatsops.co.nz;

    ssl_certificate /etc/letsencrypt/live/staff.chatsops.co.nz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staff.chatsops.co.nz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /APG {
        return 301 /APG/;
    }

    location /APG/static/ {
        alias /opt/apg-importer/app/static/;
        access_log off;
        expires 30d;
    }

    location /APG/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /APG;
        proxy_set_header X-Forwarded-Prefix /APG;
        proxy_read_timeout 180;
    }

    location / {
        return 302 /APG/dcs;
    }
}
