server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/3.107.209.189/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3.107.209.189/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location = /Simulator {
        return 301 /Simulator/;
    }

    location /Simulator/static/ {
        alias /opt/simulator-bookings/static/;
        access_log off;
        expires 30d;
    }

    location /Simulator/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /Simulator;
        proxy_set_header X-Forwarded-Prefix /Simulator;
    }

    location /APG/static/ {
        alias /opt/apg-importer/app/static/;
        access_log off;
        expires 30d;
    }

    location /APG/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /APG;
        proxy_set_header X-Forwarded-Prefix /APG;
        proxy_read_timeout 180;
    }

    location / {
        proxy_pass http://unix:/opt/lms-platform/lms.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
