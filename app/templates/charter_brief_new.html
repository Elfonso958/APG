{% extends "base.html" %}
{% block head_extra %}<link rel="stylesheet" href="{{ url_for('static', filename='charter_briefs.css') }}?v=1">{% endblock %}
{% block content %}
<section class="brief-page narrow"><p class="brief-kicker">Operations</p><h1>New charter brief</h1><p>Creates a draft. You can add flights, crew and operational arrangements next.</p><form method="post" class="brief-form"><input type="hidden" name="csrf_token" value="{{ apg_csrf_token }}"><label>Charter start date<input name="start_date" type="date" value="{{ today.isoformat() }}"></label><button class="btn" type="submit">Create draft</button><a class="btn secondary" href="{{ url_for('ui.ops_charter_briefs') }}">Cancel</a></form></section>
{% endblock %}
