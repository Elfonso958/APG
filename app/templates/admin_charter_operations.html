{% extends "base.html" %}
{% block content %}
<div class="page-header mb-3"><div><div class="page-kicker">Administration</div><h1 class="page-title">Charter operations directory</h1><div class="page-subtitle">Maintain catering services and the airport handling / fuel directory used by charter briefs.</div></div></div>
<form method="post" class="card"><div class="card-body"><input type="hidden" name="csrf_token" value="{{ apg_csrf_token }}"><label class="form-field"><span>Catering services</span><textarea name="catering_services" rows="9">{{ catering_services }}</textarea><span class="muted small">One service per line. These are available per flight or can be applied to every flight in a brief.</span></label><label class="form-field mt-3"><span>Airport handling directory</span><textarea name="airport_handling_json" rows="28" class="font-monospace">{{ airport_handling_json }}</textarea><span class="muted small">JSON directory. Keep each entry's airport, label, handler, contacts, frequency, GPU, fuel and emails as required.</span></label><div class="mt-3"><button class="btn" type="submit">Save charter operations directory</button></div></div></form>
{% endblock %}
