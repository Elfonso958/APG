<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Air Chathams Operations</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 32px 20px; color: #edf4fb; background: radial-gradient(circle at top right, #1d5b79, transparent 44%), #071925; }
    main { width: min(100%, 410px); }
    .eyebrow { margin: 0 0 10px; color: #79d9f5; font-size: .78rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 3rem); letter-spacing: -.04em; }
    .intro { margin: 14px 0 28px; color: #b8c9d7; font-size: 1.05rem; line-height: 1.55; }
    .login-card { padding: 28px; border: 1px solid #37647a; border-radius: 18px; background: linear-gradient(145deg, #123248, #0b2233); box-shadow: 0 30px 90px #0005; }
    .error { margin: 0 0 18px; padding: 12px; border: 1px solid #a85b5b; border-radius: 9px; background: #4d2027; color: #ffe5e5; font-size: .92rem; line-height: 1.4; }
    form { display: grid; gap: 16px; }
    label { display: grid; gap: 6px; color: #d9f6ff; font-size: .88rem; font-weight: 700; }
    input { width: 100%; border: 1px solid #477489; border-radius: 9px; background: #071923; color: #fff; padding: 12px; font: inherit; }
    input:focus { border-color: #73d4ee; outline: 2px solid #73d4ee55; }
    button { border: 0; border-radius: 9px; padding: 12px 16px; background: #65d3ef; color: #062033; font: inherit; font-weight: 800; cursor: pointer; }
    button:hover, button:focus-visible { background: #8be3f7; outline: none; }
    footer { margin-top: 22px; color: #8ea8ba; font-size: .85rem; text-align: center; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Air Chathams · Operations</p>
    <h1>Sign in</h1>
    <p class="intro">Use your Envision username and password to continue to your operational workspace.</p>
    <section class="login-card" aria-label="APG account sign in">
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ apg_csrf_token }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label>Envision username<input name="identity" required autocomplete="username" autofocus></label>
        <label>Envision password<input name="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Sign in</button>
      </form>
    </section>
    <footer>Staff operations portal</footer>
  </main>
</body>
</html>
