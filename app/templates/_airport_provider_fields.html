<header><h2>{% if provider %}Edit {{ provider.label }}{% else %}Add handling provider{% endif %}</h2></header><div class="provider-form"><label>Airport code<input name="airport" required maxlength="8" value="{{ provider.airport if provider else '' }}" placeholder="e.g. AKL"></label><label>Provider label<input name="label" required maxlength="180" value="{{ provider.label if provider else '' }}" placeholder="e.g. AKL (ACL)"></label><label>Handler<input name="handler" value="{{ provider.handler if provider else '' }}"></label><label>Contact<input name="contact" value="{{ provider.contact if provider else '' }}"></label><label>Phone<input name="phone" value="{{ provider.phone if provider else '' }}"></label><label>Additional phone<input name="additional_phone" value="{{ provider.additional_phone if provider else '' }}"></label><label>Frequency<input name="frequency" value="{{ provider.frequency if provider else '' }}"></label><label>GPU<input name="gpu" value="{{ provider.gpu if provider else '' }}"></label><label class="wide">Email addresses<textarea name="email_addresses" rows="3" placeholder="One address per line">{{ provider.email_addresses if provider else '' }}</textarea></label><label class="wide">Fuel<textarea name="fuel" rows="3">{{ provider.fuel if provider else '' }}</textarea></label><label class="wide">Notes<textarea name="notes" rows="3">{{ provider.notes if provider else '' }}</textarea></label></div>
