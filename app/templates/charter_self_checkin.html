<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACCharters pre-check-in</title>
<style>
body{margin:0;background:#e8f5f3;color:#173743;font:16px Arial,sans-serif}.card{max-width:600px;margin:30px auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 28px #073b5c24}.head{padding:22px;background:#075c74;color:#fff}.head img{max-width:190px;background:#fff;padding:4px}.body{padding:24px}.muted{color:#5c7478}.error{color:#b42318}.success{color:#087443}.bag{display:flex;gap:10px;align-items:center;padding:14px;background:#f2fbf8;border-radius:8px}.bag input{width:auto}.btn{margin-top:20px;width:100%;padding:13px;border:0;border-radius:7px;background:#137b91;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}.btn:disabled{opacity:.55}.seatmap-wrap{margin-top:14px;border:1px solid #c9dfe0;border-radius:12px;padding:16px;background:#f8fcfb}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:0 0 16px}.legend span{display:inline-flex;gap:5px;align-items:center}.swatch{width:14px;height:14px;border:1px solid #87afb2;border-radius:4px;background:#fff}.swatch.selected{background:#137b91;border-color:#137b91}.swatch.occupied{background:#d7e0e0;border-color:#d7e0e0}.seatmap{max-width:330px;margin:auto}.seat-row{display:grid;grid-template-columns:24px 1fr 18px 1fr;gap:7px;align-items:center;margin:7px 0}.row-number{text-align:center;color:#5c7478;font-size:12px}.block{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.block.saab{grid-template-columns:1fr}.seat{min-height:38px;border:1px solid #87afb2;border-radius:7px;background:#fff;color:#173743;font-weight:bold;cursor:pointer}.seat:hover:not(:disabled){border-color:#075c74;background:#e5f5f2}.seat.selected{background:#137b91;color:#fff;border-color:#137b91}.seat.occupied{background:#d7e0e0;border-color:#d7e0e0;color:#6c7d80;cursor:not-allowed}.seat.reserve{opacity:.55;cursor:not-allowed}.seat-note{font-size:13px;margin:12px 0 0}.hidden{display:none}
</style></head>
<body><main class="card"><header class="head"><img src="{{ url_for('ui.charter_brand_asset', asset='main-logo') }}" alt="ACCharters"><h1>Pre-check-in</h1></header><section class="body">
<p id="flight" class="muted">Loading your flight…</p><h2 id="name"></h2><p>Choose your seat and let our team know if you have a checked bag. The bag will be weighed by a check-in agent.</p><p><strong>Carry-on allowance:</strong> one bag up to 7 kg.</p>
<section id="seatSection"><h3>Choose your seat</h3><div class="seatmap-wrap"><p class="legend"><span><i class="swatch"></i>Available</span><span><i class="swatch selected"></i>Your seat</span><span><i class="swatch occupied"></i>Unavailable</span></p><div id="seatmap" class="seatmap" aria-label="Seat map"></div><p class="seat-note muted">Select an available seat.</p></div></section>
<label class="bag"><input id="bag" type="checkbox"> I have a checked bag to weigh</label><p id="message" class="error" role="alert"></p><button id="save" class="btn">Save pre-check-in</button>
</section></main>
<script>
const api="{{ url_for('api.api_charter_self_checkin', token=token) }}",map=document.querySelector('#seatmap'),bag=document.querySelector('#bag'),msg=document.querySelector('#message'),save=document.querySelector('#save');let selectedSeat='',loaded={};
function rows(f){const reg=String(f.registration||'').replace(/-/g,'').toUpperCase(),type=String(f.aircraft_type||'').toUpperCase();if(type.includes('ATR')||reg.startsWith('ZKMC'))return Array.from({length:17},(_,i)=>[i+1,['A','B'],['C','D'],'atr']);if(type.includes('SAAB')||type.includes('SF3')||type.includes('SF340')||reg.startsWith('ZKCI')||reg.startsWith('ZKKR')){if(reg==='ZKCIT')return [[0,[],['C'],'saab'],...Array.from({length:10},(_,i)=>[i+1,['A'],['B','C'],'saab']),[11,['A'],['C','D'],'saab']];if(reg==='ZKCIZ')return [...Array.from({length:10},(_,i)=>[i+1,['A'],['B','C'],'saab']),[11,['A','B'],['C','D'],'saab']];return Array.from({length:11},(_,i)=>[i+1,['A'],['B','C'],'saab']);}return Array.from({length:17},(_,i)=>[i+1,['A','B'],['C','D'],'atr']);}
function btn(row,letter,occupied){const value=`${row}${letter}`,selected=value===selectedSeat,reserved=['1A','0C'].includes(value);return `<button type="button" class="seat ${selected?'selected':''} ${occupied?'occupied':''} ${reserved&&!selected?'reserve':''}" data-seat="${value}" ${occupied||reserved&&!selected?'disabled':''}>${value}</button>`}
function render(){const occupied=new Set(loaded.occupied_seats||[]);map.innerHTML=rows(loaded.flight||{}).map(([row,left,right,type])=>`<div class="seat-row"><span class="row-number">${row||''}</span><div class="block ${type==='saab'?'saab':''}">${left.map(x=>btn(row,x,occupied.has(`${row}${x}`))).join('')}</div><span></span><div class="block">${right.map(x=>btn(row,x,occupied.has(`${row}${x}`))).join('')}</div></div>`).join('');map.querySelectorAll('[data-seat]').forEach(x=>x.onclick=()=>{selectedSeat=x.dataset.seat;render()})}
fetch(api).then(r=>r.json()).then(d=>{if(!d.ok)throw Error(d.error);loaded=d;const p=d.passenger||{},f=d.flight||{};document.querySelector('#name').textContent=`${p.GivenName||''} ${p.Surname||''}`.trim();document.querySelector('#flight').textContent=`${f.flight_no||'Charter'} · ${f.dep||''} to ${f.ades||''}${f.registration?` · ${f.registration}`:''}`;bag.checked=!!p.BagToWeigh;selectedSeat=p.Seat||'';if(String(p.PassengerType||'').toUpperCase()==='INF'){document.querySelector('#seatSection').classList.add('hidden');selectedSeat=''}else render()}).catch(e=>msg.textContent=e.message);
save.onclick=()=>{save.disabled=true;fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({Seat:selectedSeat,BagToWeigh:bag.checked})}).then(r=>r.json()).then(d=>{if(!d.ok)throw Error(d.error);msg.className='success';msg.textContent=d.message}).catch(e=>{msg.className='error';msg.textContent=e.message}).finally(()=>save.disabled=false)};
</script></body></html>
