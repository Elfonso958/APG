<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACCharters pre-check-in</title><style>body{margin:0;background:#e8f5f3;color:#173743;font:16px Arial,sans-serif}.card{max-width:560px;margin:30px auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 28px #073b5c24}.head{padding:22px;background:#075c74;color:#fff}.head img{max-width:190px;background:#fff;padding:4px}.body{padding:24px}label{display:block;margin:18px 0 8px;font-weight:bold}select,input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #c9dfe0;border-radius:7px;font:inherit}.bag{display:flex;gap:10px;align-items:center;padding:14px;background:#f2fbf8;border-radius:8px}.bag input{width:auto}.btn{margin-top:20px;width:100%;padding:13px;border:0;border-radius:7px;background:#137b91;color:#fff;font-weight:bold;font-size:16px}.muted{color:#5c7478}.error{color:#b42318}</style></head><body><main class="card"><header class="head"><img src="{{ url_for('ui.charter_brand_asset', asset='main-logo') }}" alt="ACCharters"><h1>Pre-check-in</h1></header><section class="body"><p id="flight" class="muted">Loading your flight…</p><h2 id="name"></h2><p>Choose your seat and let our team know if you have a checked bag. The bag will be weighed by a check-in agent.</p><p><strong>Carry-on allowance:</strong> one bag up to 7 kg.</p><label for="seat">Seat</label><select id="seat"><option value="">Choose at the airport</option></select><label class="bag"><input id="bag" type="checkbox"> I have a checked bag to weigh</label><p id="message" class="error"></p><button id="save" class="btn">Save pre-check-in</button></section></main><script>const api="{{ url_for('api.api_charter_self_checkin', token=token) }}",seat=document.querySelector('#seat'),bag=document.querySelector('#bag'),msg=document.querySelector('#message');fetch(api).then(r=>r.json()).then(d=>{if(!d.ok)throw Error(d.error);document.querySelector('#name').textContent=`${d.passenger.GivenName||''} ${d.passenger.Surname||''}`;document.querySelector('#flight').textContent=`${d.flight.flight_no||'Charter'} · ${d.flight.dep||''} to ${d.flight.ades||''}`;bag.checked=!!d.passenger.BagToWeigh;for(let r=1;r<=17;r++)['A','B','C','D'].forEach(c=>{let o=document.createElement('option');o.value=`${r}${c}`;o.textContent=o.value;if(o.value===d.passenger.Seat)o.selected=true;seat.append(o)})}).catch(e=>msg.textContent=e.message);document.querySelector('#save').onclick=()=>fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({Seat:seat.value,BagToWeigh:bag.checked})}).then(r=>r.json()).then(d=>{if(!d.ok)throw Error(d.error);msg.className='';msg.textContent=d.message}).catch(e=>{msg.className='error';msg.textContent=e.message});</script></body></html>
