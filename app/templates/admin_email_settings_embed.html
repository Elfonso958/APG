<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;padding:22px;color:#173743;background:#f2fbf8;font:14px Arial,sans-serif}h2{margin:0 0 6px;color:#075c74}.muted{color:#5c7478;font-size:12px}label{display:grid;gap:6px;margin:18px 0;color:#5c7478;font-size:12px;font-weight:bold}input,select{padding:9px;border:1px solid #c9dfe0;border-radius:7px;font:14px Arial}.btn{padding:10px 14px;border:0;border-radius:7px;background:#137b91;color:#fff;font-weight:bold;cursor:pointer}</style></head><body><h2>Charter email settings</h2><p class="muted">Changes save without leaving Charter Requests.</p><form method="post" action="{{ url_for('ui.admin_email_settings', embed='1') }}"><input type="hidden" name="csrf_token" value="{{ apg_csrf_token }}"><label>Charter Request approval distribution list<input name="charter_request_recipients" value="{{ charter_request_recipients }}" placeholder="ops@example.com, charter@example.com"></label><label>Flight Operations recipients<input name="flight_operations_email" value="{{ configured_recipients }}"></label><label>Send Charter Request emails from<select name="from_email">{% for sender in sender_options %}<option value="{{ sender }}" {% if (settings and settings.from_email == sender) or (not settings or not settings.from_email) and sender == 'info@accharters.co.nz' %}selected{% endif %}>{{ sender }}</option>{% endfor %}</select></label><label><input type="checkbox" name="charter_closure_emails_enabled" value="1" {% if not settings or settings.charter_closure_emails_enabled %}checked{% endif %}> Send charter flight closure emails</label><button class="btn" type="submit">Save email settings</button></form></body></html>
